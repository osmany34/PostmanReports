name: Newman Tests with HTMLExtra Report

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-api-tests:
    runs-on: ubuntu-latest

    steps:
    # Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v2

    # Install Node.js
    - name: Install Node
      uses: actions/setup-node@v2
      with:
        node-version: '16.x'

    # Install newman and newman-reporter-htmlextra
    - name: Install newman
      run: |
        npm install -g newman
        npm install -g newman-reporter-htmlextra

    # Create a directory to store test results
    - name: Make Directory for results
      run: mkdir -p testResults

    # Run the Postman collection and generate HTMLExtra report
    - name: Run API Tests
      run: |
        newman run "Restful Booker BVT.postman_collection.json" \
          -e "Production.postman_environment.json" \
          -r htmlextra \
          --reporter-htmlextra-export testResults/htmlreport.html

    # Upload the report to GitHub Actions Artifacts
    - name: Output the run Details
      uses: actions/upload-artifact@v2
      with:
        name: newman-html-report
        path: testResults
